name: HeatWatch-813 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Lint & Unit Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install GDAL & System Geospatial Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Lint with Flake8
      run: |
        pip install flake8
        # Stop build if there are Python syntax errors or undefined names
        flake8 src tests app.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Pytest Unit Test Suite
      run: |
        pytest tests/ -v --tb=short

    - name: Verify Notebook Syntax
      run: |
        python -c "import json; [json.load(open(f, 'r', encoding='utf-8')) for f in ['notebooks/01_heatwatch813_quickstart.ipynb', 'notebooks/02_urban_heat_risk_pipeline.ipynb']]; print('Notebooks Valid JSON')"
